name: Auto Releases

on:
  create:
    tags:
      - v*

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4.5.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Fix Gradle permission
        run: chmod +x ./gradlew

      - name: Setup Forge env
        run: ./gradlew setup -Prun_number=${{ github.run_number }} -Prelease=true

      - name: Get version
        run: echo "CLEANROOM_VERSION=$(cat version.txt)" >> $GITHUB_ENV

      - name: Stop Gradle daemon
        run: ./gradlew --stop

      - name: Build Jars
        run: ./gradlew installerJar -Prun_number=${{ github.run_number }} -Prelease=true

      - name: Stop Gradle daemon again
        run: ./gradlew --stop
        
      - name: ziping
        run: zip CatRoom.zip build/libs
        
      - uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: "projects/cleanroom/CatRoom.zip"
          generateReleaseNotes: true
